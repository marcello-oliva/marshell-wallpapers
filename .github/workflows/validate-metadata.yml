name: Validate Metadata

on:
  pull_request:
    paths:
      - "collections/**"
      - "scripts/generate_statistics.py"
      - "scripts/generate_collections.py"
      - "scripts/initialize_categories.py"
      - "metadata/**"

jobs:
  metadata:
    name: Check generated metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate metadata
        run: |
          python scripts/generate_statistics.py
          python scripts/generate_collections.py
          python scripts/initialize_categories.py

      - name: Verify generated files are up to date
        run: |
          git diff --exit-code metadata/
